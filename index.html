<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ききがき書房</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#27304a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 太平洋が真ん中の世界地図を歩く。画面は地図帳の色で一つの世界に固定。本だけ明朝の縦組み。 */
  --sea:#4f8fb8; --land:#cfe0a6; --paper:#fbf8ee; --ink:#27304a; --muted:#666e88;
  --ai:#3d5a99; --obi:#f0b429; --line:#dcd6c2;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-book:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;padding:0 16px 24px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px;padding:14px 0 10px}
.brand{font-weight:700;font-size:22px;letter-spacing:.08em;margin:0}
.brand small{font-weight:500;font-size:12px;color:var(--muted);margin-left:12px;letter-spacing:.04em}
.where{margin:0;font-size:13px;color:var(--muted)}

.stage{position:relative;height:min(76vh,660px);min-height:440px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--sea)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.hud{position:absolute;z-index:2}
.hud.tl{top:12px;left:12px;right:66px;font-size:13px;background:rgba(251,248,238,.92);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;max-width:26em}
.zoom{position:absolute;z-index:2;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:20px;line-height:1;cursor:pointer}
.hud.bl{left:12px;bottom:12px}.hud.br{right:12px;bottom:12px}
.hud.bc{left:50%;bottom:14px;transform:translateX(-50%)}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:8px 20px;border-radius:999px;cursor:pointer;font-weight:700}
.btn.obi{background:var(--obi);color:var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hudbtn{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 16px 6px 10px;font-weight:700;cursor:pointer}
.hudbtn svg{width:30px;height:30px}
.hudbtn .dot{position:absolute;top:-6px;right:-4px;background:var(--obi);border:2px solid var(--ink);border-radius:999px;min-width:22px;height:22px;font-size:12px;line-height:18px;text-align:center}
.hudbtn.bl{padding-left:16px}

/* 会話 */
.dialog{position:absolute;z-index:3;left:10px;right:10px;bottom:10px;max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead canvas{width:84px;height:84px;flex:none}
.dhead b{font-size:18px}
.dhead .sub{font-size:12px;color:var(--muted)}
.tag{display:inline-block;background:var(--obi);border-radius:999px;padding:0 10px;font-size:12px;font-weight:700;margin-left:8px}
.dhead .x{margin-left:auto}
.log{display:flex;flex-direction:column;gap:8px}
.m{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 14px;border-radius:16px;max-width:90%}
.m.a{background:#fff;border:2px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.m.u{background:var(--ai);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--ai);color:var(--ai);border-radius:999px;padding:3px 14px;cursor:pointer;font-size:14px;font-weight:700}
.chip:hover{background:var(--ai);color:#fff}
.say{display:flex;gap:8px;align-items:flex-end}
.say textarea{flex:1}
input[type=text],textarea,select{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;line-height:1.6}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
label.chk input{margin-top:6px;flex:none}

/* 全画面の紙 */
.sheet{position:fixed;inset:0;z-index:10;background:var(--paper);overflow:auto}
.sheet .in{max-width:860px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:20px}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.shead svg{width:60px;height:60px}
.shead h2{font-size:21px;margin:0;line-height:1.4}
.shead .x{margin-left:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 18px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lead{color:var(--muted);font-size:14px;max-width:40em;margin:0}
.note{font-size:13px;color:var(--muted);border-left:4px solid var(--obi);padding:2px 0 2px 12px;max-width:44em;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pickb{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.pickb[aria-pressed="true"]{border-color:var(--ink);background:#fff7dc}
.pickb canvas{width:96px;height:96px}
.gob{text-align:left;align-items:flex-start;padding:12px 14px}
.gob small{font-weight:500;color:var(--muted)}
.fumi{display:flex;gap:10px;align-items:flex-end}
.fumi svg{width:40px;height:40px;flex:none}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter i{flex:1;max-width:240px;height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.meter i b{display:block;height:100%;background:var(--obi)}
.tategaki{writing-mode:vertical-rl;overflow-x:auto;height:min(66vh,540px);background:#fff;border:2px solid var(--ink);border-radius:6px;padding:28px 26px;font-family:var(--f-book);font-size:17px;line-height:2.1}
.tategaki h3{font-size:22px;margin:0 0 0 1.4em;letter-spacing:.14em}
.tategaki h4{font-size:17px;margin:2em 1em 0 .6em;color:var(--ai)}
.tategaki p{margin:0;text-indent:1em;white-space:pre-wrap}
.shelfbox{overflow-x:auto;padding-top:10px}
.shelf{display:flex;align-items:flex-end;gap:5px;min-width:min-content;padding:0 14px;border-bottom:12px solid var(--ink);min-height:240px}
.spine{writing-mode:vertical-rl;font-family:var(--f-book);font-weight:700;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--ai);border:none;border-radius:3px 3px 0 0;padding:14px 0 30px;width:50px;height:214px;cursor:pointer;display:flex;align-items:center;position:relative;overflow:hidden;white-space:nowrap}
.spine span{overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--obi)}
.spine.s1{background:var(--ink);height:228px;width:46px}.spine.s2{background:#5a7a4a;height:200px;width:56px}.spine.s3{background:#8a5a78;height:220px}
.spine[aria-pressed="true"]{transform:translateY(-10px)}
.pen{color:var(--muted);font-size:14px}
dl.memo{display:grid;grid-template-columns:8em 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.memo dt{color:var(--muted)}dl.memo dd{margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);display:none;z-index:20}
[hidden]{display:none!important}
@media (max-width:560px){.brand small{display:block;margin:0}.say{flex-direction:column;align-items:stretch}dl.memo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="brand">ききがき書房<small>世界を歩いて、話して、いつのまにか一冊に</small></p>
    <p class="where" id="where" aria-live="polite"></p>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" aria-label="世界地図。矢印キーかタップで歩きます"></canvas>
    <div class="hud tl" id="hint">矢印キーか、行きたい場所のタップで歩けます。＋−やホイール、ピンチで地図を拡大・縮小。拡大すると日本各地の名所が現れます。住人に近づくと声をかけてきます。</div>
    <div class="zoom"><button type="button" id="zin" aria-label="地図を拡大">＋</button><button type="button" id="zout" aria-label="地図を縮小">−</button></div>
    <button class="hudbtn hud bl" id="goBtn" type="button">行き先</button>
    <button class="btn obi hud bc" id="talkBtn" type="button" hidden></button>
    <button class="hudbtn hud br" id="fumiBtn" type="button"></button>
    <div class="dialog" id="dialog" hidden></div>
  </div>
</div>
<div class="sheet" id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="land.js"></script>
<script>
/* ================= 設定 ================= */
const PX = 12, SEAM = 30, LAT0 = 80, W = 360 * PX, H = 140 * PX, INK = '#27304a';
const wx = lon => (((lon + SEAM) % 360 + 360) % 360) * PX, wy = lat => (LAT0 - lat) * PX;
const AUTHOR_RATE = 0.7, PRICES = [300, 500, 800];
const NEED_TURNS = 8, NEED_CHARS = 800, LEARN_EVERY = 5, REBUILD_EVERY = 6;

/* 会話も本も、この同じ文章エンジン(指針+学んだメモ)で書く */
const ENGINE = `【ききがきエンジンの文章指針】
あなたは聞き書きアプリ「ききがき書房」に組み込まれた、文章専門のAI。会話のせりふも、本の原稿も、この指針で書く。
- 平易な日本語。具体的な名詞と動詞。一文は短く。決まり文句、大げさな形容、説教を避ける。
- 語り手の言葉づかいを尊重し、本人が使った言い回しは生かす。語り手について学んだメモがあれば、呼び名・話し方・好みに合わせる。
- 語り手が述べていない事実を作らない。
- AIであることは隠さない。恋人や人間の友だちの代わりのようには振る舞わない。
- 命や安全に関わる深刻な悩みが出たら、問いをやめ、身近な信頼できる人や専門の相談窓口に話すことをやさしく勧める。`;

const ANGLES = ['ある一場面をくわしく', 'そこにいた人のこと', '音・匂い・手ざわり', '数字(何歳、何年、何回)', 'もしも別の道を選んでいたら', '最初の一回', 'いちばん最近のこと', '誰かに言われたひとこと', 'いまの自分から見ると', 'ささいで小さなこと', 'そのとき体はどうだったか', 'その場所の景色にたとえると'];

const PLACES = [
  { id:'fuji', need:0, name:'富士山', country:'日本', lon:138.73, lat:35.36, theme:'今日の出来事', guide:'今日あったこと、食べたもの、会った人、いまの気分',
    npc:{ name:'ゆず', kind:'ニホンザル', voice:'一人称「あたし」。温泉好きでのんびり。「〜だねえ」「〜かい？」', sp:{ body:'#a08a70', faceBig:1, face:'#e08878', ear:'round', earS:.8, earIn:'#e08878', belly:'#cdbfa8', nz:'dot' } },
    facts:'日本一高い山(3776m)。山頂のご来光、ふもとの温泉、夏だけの登山シーズン、雲の上に出る頂',
    qs:['おや、いらっしゃい。今日のお日さまはもう見たかい？ きみの今日は、どんなふうに始まった？', 'ふもとの湯につかりながら聞きたいねえ。今日いちばん「ふう」と息をついたのは、いつだった？'] },
  { id:'eiffel', need:0, name:'エッフェル塔', country:'フランス', lon:2.29, lat:48.86, theme:'うれしかったこと・好きなもの', guide:'最近うれしかったこと、好きなもの、ときめくもの、自慢したいこと',
    npc:{ name:'ミレイユ', kind:'ネコ', voice:'一人称「あたし」。気まぐれでおしゃれ好き。「〜じゃない？」「〜よね」', sp:{ body:'#70758c', face:'#8d92a8', ear:'tri', earIn:'#c9a3ad', iris:'#e0a030', nz:'tri', whisk:1, tail:'thin' } },
    facts:'建った当時は不評だったが、いまは街の顔。夜は毎正時にきらめく。パリの街を一望できる。ふもとの芝生でピクニック',
    qs:['この塔、できた頃は嫌われてたのよ。いまは皆のお気に入り。ねえ、あなたの最近のお気に入りって何？', 'もうすぐ塔がきらきら光る時間よ。最近、あなたの心がきらっとした瞬間ってあった？'] },
  { id:'opera', need:0, name:'シドニー・オペラハウス', country:'オーストラリア', lon:151.21, lat:-33.86, theme:'楽しみ・趣味', guide:'趣味、好きな音楽や本、休みの日の過ごし方、夢中になったもの',
    npc:{ name:'マチルダ', kind:'コアラ', voice:'一人称「わたし」。マイペースで聞き上手。「〜なんだあ」「〜するの？」', sp:{ body:'#9c9ea3', face:'#b9bbc0', belly:'#e4e4e6', ear:'big', earS:.85, earIn:'#f1f1f1', nz:'big', nose:.1 } },
    facts:'帆を重ねたような白い屋根。港に面した劇場で、毎晩どこかの部屋で音楽が鳴る。完成まで十四年かかった',
    qs:['今夜もあの屋根の下で音楽が鳴るんだあ。きみが最近よく聴いてる曲とか、夢中なことって何？', 'わたしは木の上で昼寝するのが趣味。きみは休みの日、何してるときがいちばん楽しいの？'] },
  { id:'liberty', need:0, name:'自由の女神', country:'アメリカ', lon:-74.04, lat:40.69, theme:'これからの目標・夢', guide:'やってみたいこと、なりたい姿、一年後・十年後、最初の一歩',
    npc:{ name:'ペニー', kind:'ハイイロリス', voice:'一人称「あたい」。元気で前向き、せっかち。「〜しようよ！」「〜なの？」', sp:{ body:'#978d86', face:'#c9c1ba', belly:'#f3f0ec', ear:'tri', earS:.7, nz:'tri', tail:'bushy' } },
    facts:'海を渡ってきた人々が最初に見た像。右手にたいまつ、左手に銘板。フランスからの贈り物。港の入り口に立つ',
    qs:['昔ここに着いた人たちは、この像を見て「さあ、これからだ」って思ったんだって！ きみの「これから」は何？', 'あのたいまつ、ずっと先を照らしてるんだ。一年後のきみに、何を照らしててほしい？'] },
  { id:'wall', need:3, name:'万里の長城', country:'中国', lon:116.57, lat:40.43, theme:'続けてきたこと・仕事', guide:'仕事や習いごと、長く続けていること、積み重ねてきた努力',
    npc:{ name:'ロン', kind:'ジャイアントパンダ', voice:'一人称「わし」。おっとりした職人肌。「〜じゃのう」「〜かね？」', sp:{ body:'#f6f5ef', ear:'round', earC:'#2b2b33', limb:'#2b2b33', pat:'panda', nz:'big', nose:.07 } },
    facts:'何百年もかけて石を積み、総延長は二万キロを超える。山の尾根をどこまでも続く。見張り台が点々と並ぶ',
    qs:['この壁はのう、一つずつ石を積んでここまで伸びたんじゃ。きみがこつこつ積んできたものは、何かね？', '見張り台から道を眺めとった。きみの仕事の一日は、何から始まるんじゃ？'] },
  { id:'rio', need:3, name:'コルコバードのキリスト像', country:'ブラジル', lon:-43.21, lat:-22.95, theme:'友だち・仲間', guide:'親しい友人、仲間との思い出、出会い方、最近会っていない人',
    npc:{ name:'ボア', kind:'カピバラ', voice:'一人称「おいら」。誰とでも仲よくなる、おだやかな性格。「〜だよお」「〜かい？」', sp:{ body:'#a8763f', face:'#c2925a', ear:'round', earS:.6, nz:'long' } },
    facts:'丘の上で両腕を広げて街を見下ろす像。ふもとには浜辺が続き、カーニバルでは街じゅうが踊る。カピバラは他の動物とも並んでくつろぐ',
    qs:['あの像、誰でも迎えるみたいに腕を広げてるだろお。きみが腕を広げて迎えたい友だちって、誰だい？', 'おいらの背中には、よく鳥が乗って休むんだよお。きみが一緒にいて楽な相手は、どんな人？'] },
  { id:'kili', need:6, name:'キリマンジャロ', country:'タンザニア', lon:37.35, lat:-3.07, theme:'子どもの頃・原点', guide:'幼い頃の記憶、ふるさと、家の様子、好きだった遊び',
    npc:{ name:'テンボ', kind:'アフリカゾウ', voice:'一人称「ぼく」。大らかで物覚えがいい。「〜なんだなあ」「〜だったの？」', sp:{ body:'#9aa3ad', ear:'big', earIn:'#c4b0ae', nz:'trunk' } },
    facts:'アフリカでいちばん高い山。赤道の近くなのに頂に雪がある。ふもとのサバンナをゾウの群れが歩く。ゾウは昔のことをよく覚えている',
    qs:['ゾウはね、子どもの頃に歩いた道をずっと覚えてるんだなあ。きみが小さい頃によく歩いた道は、どんな道だった？', 'あの雪は赤道の近くでも消えないんだ。きみの中で、子どもの頃から変わってないものって何？'] },
  { id:'angkor', need:6, name:'アンコール・ワット', country:'カンボジア', lon:103.87, lat:13.41, theme:'学生時代・学んだこと', guide:'学校、部活、先生、勉強や修行、教わったこと',
    npc:{ name:'ソカー', kind:'スイギュウ', voice:'一人称「わたし」。まじめで面倒見のいい先生役。「〜でしたか」「〜ですね」', sp:{ body:'#5d5863', face:'#77727d', ear:'flop', horns:1, nz:'long' } },
    facts:'密林の中の石の大寺院。壁一面に物語の浮き彫りが続く。朝日が塔の後ろから昇る。長く僧たちが学んだ場所',
    qs:['ここの壁には、物語が一枚ずつ彫ってあるのですよ。あなたの学生時代を一枚彫るなら、どの場面でしょう', '朝日が塔のうしろから昇ります。あなたに何かを教えてくれた人で、最初に浮かぶのは誰ですか'] },
  { id:'giza', need:9, name:'ギザのピラミッド', country:'エジプト', lon:31.13, lat:29.98, theme:'過去の後悔', guide:'やり直したいこと、言えなかったこと、選ばなかった道。責めずに聞く',
    npc:{ name:'ハーリド', kind:'ヒトコブラクダ', voice:'一人称「わたし」。物静かで急がない語り部。「〜だったのだね」「〜だろうか」', sp:{ body:'#cfa56a', face:'#e2c494', ear:'round', earS:.55, neck:.42, hump:1, nz:'long' } },
    facts:'四千五百年前の石の墓。砂に埋もれても形が残る。夜は星がよく見える。砂漠を渡る隊商の道',
    qs:['四千年たっても、ここには残っているものがある。きみの中に、ずっと残っている「あのときこうしていれば」は、あるだろうか', '砂の上の足あとは風で消えるが、消えないものもある。あのとき言えなかった言葉が、きみにはあるかい'] },
  { id:'canyon', need:9, name:'グランドキャニオン', country:'アメリカ', lon:-112.11, lat:36.11, theme:'失敗談・笑い話', guide:'やらかしたこと、恥ずかしかったこと、いま思うと笑える話',

/* ---- AIの差し込み口 ----
   この画面の中では Claude に直接つながる。単体のアプリ(Web・iOS・Android)にするときは、
   自前のサーバー(kikigaki-ai-server.mjs)のURLを endpoint に入れるだけで、会話・学習・本の執筆がすべて同じ文章エンジンで動く。
   APIキーはサーバー側だけに置き、アプリには入れない。 */
const APP_AI = { endpoint:'', appToken:'' };
function makeAI(native){
  if (native) return native;
  if (!APP_AI.endpoint) return null;
  const call = async (path, body, onText) => {
    let res;
    try { res = await fetch(APP_AI.endpoint.replace(/\/$/, '') + path, { method:'POST', headers:{ 'content-type':'application/json', ...(APP_AI.appToken ? { authorization:'Bearer ' + APP_AI.appToken } : {}) }, body:JSON.stringify(body) }); }
    catch (e) { throw { code:'unavailable', message:String(e) }; }
    if (res.status === 429) throw { code:'rate_limited', message:'rate limited' };
    if (!res.ok) throw { code:'unavailable', message:'HTTP ' + res.status };
    if (!onText || !res.body) return res;
    const rd = res.body.getReader(), dec = new TextDecoder(); let text = '';
    for (;;){ const { done, value } = await rd.read(); if (done) break; const delta = dec.decode(value, { stream:true }); text += delta; onText({ text, delta }); }
    return text;
  };
  const tier = o => (o && o.modelTier) || 'default';
  const ai = async (prompt, o) => { const text = await call('/text', { prompt, tier:tier(o) }, (o && o.onText) || (() => {})); return { text, truncated:false }; };
  ai.json = async (prompt, o) => (await call('/json', { prompt, tier:tier(o) })).json();
  return ai;
}

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

const LAI = { engine:null, state:'off', progress:0, text:'', err:'', model:(() => { try { return localStorage.getItem('kk-ai-model') || ''; } catch { return ''; } })() };
async function loadLocalAI(modelId){
  if (LAI.state === 'loading') return;
  if (!navigator.gpu){ LAI.state = 'nogpu'; return aiView(); }
  LAI.state = 'loading'; LAI.progress = 0; LAI.text = '準備しています…'; LAI.err = ''; aiView();
  const cb = r => { LAI.progress = r.progress || 0; LAI.text = r.text || ''; const b = $('#aibar'), t = $('#aitext'); if (b) b.style.width = Math.round(LAI.progress * 100) + '%'; if (t) t.textContent = LAI.text; };
  try{
    const lib = await import('./web-llm.js');
    let eng;
    try { eng = await lib.CreateMLCEngine(modelId, { initProgressCallback:cb }); }
    catch (e) { eng = await lib.CreateMLCEngine(modelId.replace('q4f16_1', 'q4f32_1'), { initProgressCallback:cb }); }
    LAI.engine = eng; LAI.model = modelId; LAI.state = 'ready';
    try { localStorage.setItem('kk-ai-model', modelId); } catch {}
    if (!sample || sample.local) sample = localAI();
    toast('ふみ「端末の中のAIの準備ができたよ」');
  }catch(e){ LAI.state = 'error'; LAI.err = String((e && e.message) || e).slice(0, 200); }
  if (LAI.state === 'error' && IS_PHONE) LAI.err = 'この端末のメモリでは足りない可能性があります。より軽いモデルを選んでください。' + LAI.err.slice(0, 80);
  aiView(); if (S.dlg) renderDialog();
}
function localAI(){
  let chain = Promise.resolve();                       // 端末内AIは一度に一つずつ
  const run = fn => { const p = chain.then(fn, fn); chain = p.catch(() => {}); return p; };
  const ai = (prompt, o = {}) => run(async () => {
    const stream = await LAI.engine.chat.completions.create({ messages:[{ role:'user', content:prompt }], stream:true, temperature:.8, max_tokens:o.max || 200 });
    let text = '';
    for await (const ch of stream){ const d = (ch.choices[0] && ch.choices[0].delta && ch.choices[0].delta.content) || ''; text += d; if (o.onText) o.onText({ text, delta:d }); }
    return { text:text.replace(/<think>[\s\S]*?<\/think>/g, '').trim(), truncated:false };
  });
  ai.json = (prompt, o = {}) => run(async () => {
    const r = await LAI.engine.chat.completions.create({ messages:[{ role:'user', content:prompt }], temperature:.3, max_tokens:o.max || 600, response_format:{ type:'json_object' } });
    return JSON.parse(r.choices[0].message.content);
  });
  ai.local = true;
  return ai;
}

function parseReply(text, name){
  const [body, tail] = String(text || '').split('###');
  const chips = (tail || '').split(/[|｜\n]/).map(x => x.trim()).filter(x => x && x.length <= 18).slice(0, 3);
  return [body.replace(new RegExp('^' + name + '[:：]\\s*'), '').trim(), chips];
}

async function npcSpeak(mode){
  const p = S.dlg.p;
  S.busy = true; S.chips = []; renderDialog();
  let reply = '', chips = [];
  if (sample){
    try{
      const r = await sample(npcPrompt(p, mode, pick(ANGLES)), { cache:false, onText: ({text}) => {
        const b = $('#pending'); if (!b) return;
        b.textContent = (/^Thinking/.test(text) ? '' : text.split('###')[0].trim()) || '……';
      }});
      [reply, chips] = parseReply(r && r.text, p.npc.name);
    }catch(e){ if (e && e.code === 'not_granted') sample = null; }
  }
  if (!S.dlg || S.dlg.p !== p){ S.busy = false; return; }
  if (!reply){
    reply = mode === 'open' ? pick(p.qs) : pick(['うんうん。それで、そのあとどうなったの？', 'へえ。そのとき、そばには誰がいた？', 'そっか。そのとき、どんな気持ちだった？', 'なるほどねえ。もう少しくわしく聞いてもいい？']);
    chips = ['うん', 'うーん、どうだろ', 'また今度話すね'];
  }
  if (!chips.length) chips = ['うん', 'うーん、どうだろ', 'もう少しくわしく話すね'];
  reply = reply.replace(/^[「『]|[」』]$/g, '').slice(0, 400);
  S.journal.push({ p:p.id, r:'a', c:reply, t:Date.now() });
  S.chips = chips; S.busy = false; save('journal'); renderDialog();
  if (mode === 'reply') background();
}

}
function pairs(since){
  const out = [];
  S.journal.forEach((e, i) => {
    if (e.r !== 'u' || e.t <= since) return;
    const q = S.journal[i - 1], pl = placeOf(e.p);

  });
  return out.join('\n\n');
}

      }

      ctx.save(); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(39,48,74,.75)'; ctx.lineJoin = 'round'; LM[p.id] ? LM[p.id](ctx) : IC[p.icon](ctx, p.col); ctx.restore();

const keys = {};
let last = 0;
function frame(ts){

    if (dx || dy) S.tx = S.ty = null;
    else if (S.tx != null){ dx = S.tx - S.x; dy = S.ty - S.y; if (Math.hypot(dx, dy) < 5){ S.tx = S.ty = null; dx = dy = 0; } }
    const len = Math.hypot(dx, dy);
    if (len){ const sp = 320 * dt / Math.pow(S.z, .75); S.x = Math.max(24, Math.min(W - 24, S.x + dx / len * sp)); S.y = Math.max(44, Math.min(H - 20, S.y + dy / len * sp)); }

    let best = null, bd = 1e9, aura = false, jpNear = false;

      if (!isOpen(p)){
        if (p.hidden){ if (wd < 130){ (S.meta.found = S.meta.found || []).push(p.id); save('me'); toast(`かくれ場所を見つけました：${p.name}`); S.hudKey = ''; } else if (wd < 420) aura = true; }
        continue;
      }
      if (p.minZ && z < p.minZ){ if (wd < 60) jpNear = true; continue; }
      const d = Math.hypot((p.x - S.x) * z + 30 * k, (p.y - S.y) * z + 20 * k);
      if (d < bd){ bd = d; best = p; }
    }
    const near = bd < 84 * k ? best : null;
    const key = (near ? near.id : '') + '|' + best.id + '|' + Math.round(Math.atan2(best.y - S.y, best.x - S.x) * 4 / Math.PI) + '|' + aura + jpNear;
    if (key !== S.hudKey){ if (near !== S.near) S.hail = near ? hail(near) : ''; S.hudKey = key; S.near = near; S.best = best; S.aura = aura; S.jpNear = jpNear; drawHud(); }

    S.idle = near ? 0 : (S.idle || 0) + dt;
    if (S.idle > 40){
      S.idle = 0;
      const open = PLACES.filter(p => isOpen(p)), cnt = p => S.journal.filter(e => e.p === p.id && e.r === 'u').length, min = Math.min(...open.map(cnt)), p = pick(open.filter(q => cnt(q) === min));
      S.relay = { text:pick([`ふみ「${p.name}で${p.npc.name}が呼んでるよ」`, `ふみ「${p.npc.name}から伝言。聞きたいことがあるって」`, `ふみ「${p.npc.name}が、${p.theme}の話を聞きたいって」`]), until:ts + 8000 };

}
/* 住人の呼びかけ。初対面か、何度目か、時間帯、かくれ場所かで変わる */
function hail(p){
  const n = S.journal.filter(e => e.p === p.id && e.r === 'u').length, call = (S.profile || {}).callName, hr = new Date().getHours();
  if (p.hidden && !n) return pick(['……見つかっちゃった', 'よくここが分かったね', 'しーっ。ここは内緒の場所', 'お客さんなんて、はじめてだ']);
  if (p.run) return pick(n ? ['まってまって〜！', 'いたいた！ さがしたよ', '走ってきちゃった！'] : ['まって〜！ 旅の人！', 'ちょっと、そこの人〜！', 'いま行くから動かないで！']);
  const pool = n ? ['また来てくれたんだ！', '待ってたよ', 'このあいだの続き、聞かせて', 'おかえり！', '今日はどんな話？', 'あ、ちょうどよかった'] : ['はじめまして！', 'やあ、旅の人', 'ねえねえ、ちょっといい？', 'いいところに来たね', '聞きたいことがあるんだ', 'こっちこっち！', 'そこの旅の人〜', 'ひとつ聞いてもいい？'];
  if (call && n) pool.push(`あ、${call}だ！`, `${call}、こっち！`);
  pool.push(hr < 5 ? '夜ふかしだね' : hr < 11 ? 'おはよう！' : hr < 17 ? 'こんにちは！' : hr < 20 ? '夕方だね、おつかれさま' : 'こんばんは');

function drawHud(){

  $('#goBtn').hidden = $('#fumiBtn').hidden = !!S.dlg; document.querySelector('.zoom').hidden = !!S.dlg;
  const fb = $('#fumiBtn');
  fb.replaceChildren(svg(), 'ふみ'); if (S.news) fb.append(h('span', { class:'dot', 'aria-label':'お知らせあり' }, '本'));
  const w = $('#where'), b = S.best;
  if (S.near) w.textContent = `${S.near.name}（${S.near.country}）に着きました`;
  else if (S.aura) w.textContent = '……近くに、何かの気配がします';
  else if (S.jpNear) w.textContent = '地図を拡大（＋）すると、近くの名所が現れます';
  else if (b){ const a = Math.round(Math.atan2(b.y - S.y, b.x - S.x) * 4 / Math.PI); w.textContent = `いちばん近い名所: ${b.name} ${['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'][(a + 8) % 8]}`; }
}
window.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (e.key === 'Escape'){ if (S.dlg) closeDialog(); else if (S.sheet && S.avatar) closeSheet(); return; }
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || S.dlg || S.sheet) return;
  if ((e.key === 'Enter' || e.key === ' ') && S.near && t !== 'BUTTON'){ e.preventDefault(); openDialog(S.near); return; }
  if (e.key === '+' || e.key === ';' || e.key === '=') return zoomTo(S.z * 1.4);
  if (e.key === '-') return zoomTo(S.z / 1.4);
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(k)){ keys[k] = true; if (k.startsWith('Arrow')) e.preventDefault(); $('#hint').hidden = true; }
});
window.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const touches = new Map(); let pinch = null;

  if (e.type === 'pointerdown' && n && Math.hypot((n.x - camx) * z + n.ox * k - sx, (n.y - camy) * z + (n.oy - 36) * k - sy) < 50 * k) return openDialog(n);
  S.tx = camx + sx / z; S.ty = camy + sy / z; $('#hint').hidden = true;
}
const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
cv.addEventListener('pointerdown', e => {

cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);

$('#zin').addEventListener('click', () => zoomTo(S.z * 1.5));

$('#talkBtn').addEventListener('click', () => S.near && openDialog(S.near));
$('#goBtn').addEventListener('click', () => openSheet('go'));
$('#fumiBtn').addEventListener('click', () => openSheet('fumi'));

/* ================= 起動 ================= */
async function boot(){
  if (IS_PHONE) $('#hint').textContent = '行きたい場所をタップすると歩きます。二本指のピンチか＋−で地図を拡大・縮小。拡大すると日本各地の名所が現れます。';

  new ResizeObserver(resize).observe($('#stage'));
